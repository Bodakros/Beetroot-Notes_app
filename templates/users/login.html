{% extends 'base/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white text-center">
                    <h2 class="card-title mb-0 h3">Вхід в систему</h2>
                </div>

                <div class="card-body p-4">
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            <h5>Помилка!</h5>
                            <p class="mb-0">Неправильний логін або пароль. Спробуйте ще раз.</p>
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label">
                                Ім'я користувача
                            </label>
                            <input type="text" name="username" class="form-control" 
                                   placeholder="Введіть ім'я користувача" 
                                   id="{{ form.username.id_for_label }}" required>
                        </div>

                        <div class="mb-4">
                            <label for="{{ form.password.id_for_label }}" class="form-label">
                                Пароль
                            </label>
                            <input type="password" name="password" class="form-control" 
                                   placeholder="Введіть пароль" 
                                   id="{{ form.password.id_for_label }}" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Увійти
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="text-muted mb-0">
                            Ще не маєте акаунту? 
                            <a href="{% url 'register' %}" class="text-decoration-none fw-bold">
                                Зареєструватися
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
